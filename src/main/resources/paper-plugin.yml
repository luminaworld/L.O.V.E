name: LuminarisCore
version: '${version}'
main: com.luminaris.extraction.LuminarisCorePlugin
api-version: '1.21'
folia-supported: true
authors:
  - LuminarisTeam
description: Unified Vanilla Extraction Core Engine (L.O.V.E)

permissions:
  luminaris.admin:
    description: Grants full administrative access to Luminaris Core
    default: op
  luminaris.editor:
    description: Allows editing map templates and managing container markers
    default: op
  luminaris.extract:
    description: Allows player to participate in extractions
    default: true
  luminaris.security.clientguard.admin:
    description: Grants administrative access to Client Guard commands
    default: op
  luminaris.security.clientguard.alert:
    description: Receives real-time security alerts when cheat clients or mods are detected
    default: op
  luminaris.security.clientguard.bypass:
    description: Bypasses all client guard inspections and enforcement
    default: "false"
