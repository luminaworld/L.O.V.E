# =========================================================================
# Luminaris: Operation Vanilla Extraction Core Engine (L.O.V.E)
# การกำหนดค่าหมวดหมู่คอนเทนเนอร์ (Container Categories Configuration)
# =========================================================================
#
# คำอธิบายภาพรวม:
# ไฟล์นี้ใช้กำหนดรูปแบบของกล่องคอนเทนเนอร์ (หีบธรรมดา, แอร์ดรอป, ตู้เซฟ) ในระบบการสกัดหลบหนี
# โดยกล่องดรอปแต่ละประเภทจะเป็นตัวกำหนดว่า:
# 1. จะดรอปของระดับความหายากอะไร โอกาส (เปอร์เซ็นต์/น้ำหนัก) เท่าไหร่
# 2. จำนวนกี่ชิ้นแบบละเอียด (min_rolls ถึง max_rolls)
#
# วิธีการตั้งค่าแต่ละพารามิเตอร์:
# -------------------------------------------------------------------------
# display_name:
#   ชื่อที่แสดงผลของกล่อง รองรับ MiniMessage แบบสมบูรณ์
#
# min_rolls:
#   จำนวนชิ้นไอเทมขั้นต่ำที่จะถูกสุ่มดรอปในกล่องนี้
#
# max_rolls:
#   จำนวนชิ้นไอเทมสูงสุดที่จะถูกสุ่มดรอปในกล่องนี้
#
# rarity_chances:
#   กำหนดเปอร์เซ็นต์/ค่าน้ำหนักโอกาสออกของแต่ละระดับความหายาก
#   - COMMON
#   - UNCOMMON
#   - RARE
#   - EPIC
#   - LEGENDARY
#
# คำสั่งจัดการในเกม:
#   - /ext editor : เปิดหน้าต่าง GUI จัดการกล่องดรอปและไอเทมทั้งหมดในคำสั่งเดียว
# =========================================================================

