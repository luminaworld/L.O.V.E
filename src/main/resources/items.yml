# =========================================================================
# Luminaris: Operation Vanilla Extraction Core Engine (L.O.V.E)
# การกำหนดค่าฐานข้อมูลไอเทมการสกัด (Extraction Items Registry Configuration)
# =========================================================================
#
# คำอธิบายภาพรวม:
# ไฟล์นี้เป็นฐานข้อมูลรายการไอเทมทั้งหมดที่สามารถสุ่มพบได้ในคอนเทนเนอร์ (Loot Containers)
# ระหว่างการเล่นแมตช์การสกัดหลบหนี ผู้เล่นสามารถเก็บไอเทมเหล่านี้เพื่อนำกลับไปขาย
# รับเงินรางวัล หรือใช้เป็นวัตถุดิบล้ำค่าตามระบบเศรษฐกิจของเซิร์ฟเวอร์
#
# วิธีการตั้งค่าแต่ละพารามิเตอร์:
# -------------------------------------------------------------------------
# material:
#   ชนิดของไอเทม Minecraft (Bukkit Material Name เช่น REPEATER, NETHER_STAR, COOKED_BEEF, DIAMOND)
#
# display_name:
#   ชื่อที่แสดงผลของไอเทม รองรับ MiniMessage แบบสมบูรณ์
#   - สีเดี่ยว: <color:#HEX>ข้อความ</color> (เช่น <color:#55FF55>ข้อความ</color>)
#   - ไล่เฉดสี: <gradient:#HEX1:#HEX2>ข้อความ</gradient> (เช่น <gradient:#00FFA3:#00B8FF>...</gradient>)
#
# rarity (หรือ tier):
#   ระดับความหายากของไอเทม เรียงจากน้อยไปมาก:
#   - F : ระดับพื้นฐาน (เดิม COMMON)
#   - D : ระดับไม่ธรรมดา (เดิม UNCOMMON)
#   - C : ระดับหายาก (เดิม RARE)
#   - B : ระดับมหากาพย์ (เดิม EPIC)
#   - A : ระดับตำนาน (เดิม LEGENDARY)
#   - S : ระดับสูงสุด (สีแดง ระดับพิเศษล้ำค่า)
#
# price (หรือ value):
#   มูลค่าการสกัดหรือราคาขายของไอเทม (ทศนิยม เช่น 50.0, 750.0, 3500.0, 10000.0)
#
# weight:
#   ค่าน้ำหนักโอกาสสุ่มดรอป (Spawn Weight)
#   - ตัวเลขยิ่งสูง = โอกาสสุ่มได้ไอเทมชิ้นนี้ยิ่งมีมาก (เช่น 50 - 100 เหมาะกับไอเทมทั่วไป)
#   - ตัวเลขยิ่งต่ำ = โอกาสสุ่มได้ไอเทมชิ้นนี้ยิ่งน้อยมาก (เช่น 1 - 5 เหมาะกับไอเทมตำนาน)
#   - หากตั้งเป็น 0.0 ไอเทมชิ้นนี้จะไม่ถูกสุ่มดรอปในระบบ
#
# allowed_containers:
#   รายการหมวดหมู่ของคอนเทนเนอร์ที่อนุญาตให้ไอเทมชิ้นนี้สุ่มเกิดได้
#   (ต้องตรงกับรหัสหมวดหมู่ใน categories.yml เช่น normal_crate, airdrop, safe_box, F, D, C, B, A, S)
#   - หากเว้นว่างไว้หรือไม่ใส่คีย์นี้ ไอเทมจะสามารถสุ่มเกิดได้ในคอนเทนเนอร์ทุกหมวดหมู่
#
# search_time:
#   ระยะเวลาที่ใช้ในการค้นหาไอเทมชิ้นนี้ (หน่วย: วินาที)
#   ระบบจะใช้วินาทีนี้ในการนับถอยหลังจากบล็อกหิน (searchingMaterial) จนกว่าจะเปิดเผยไอเทมจริง
#
# reveal_sound:
#   เสียงเอฟเฟกต์เฉพาะที่จะเล่นเมื่อค้นหาไอเทมชิ้นนี้สำเร็จ (เช่น ENTITY_ITEM_PICKUP, BLOCK_NOTE_BLOCK_CHIME, UI_TOAST_CHALLENGE_COMPLETE)
#   หากไม่กำหนด ระบบจะใช้เสียงเปิดเผยเริ่มต้นของกล่องหมวดหมู่นั้นๆ
#
# lore:
#   รายการคำอธิบายคุณสมบัติใต้ไอเทม (Lore List)
#   ใช้รูปแบบแท็กสีเดี่ยว <color:#HEX>ข้อความ</color> หรือ <gradient:#HEX1:#HEX2>ข้อความ</gradient>
#
# การลงทะเบียนไอเทมผ่านตัวแก้ไขในเกม (In-game Editor):
#   - คุณสามารถเพิ่มไอเทมใหม่ได้ง่ายๆ ผ่านคำสั่ง:
#     /ext editor
#     แล้วกดช่องเพิ่มในหน้า GUI และเลือกไอเทมที่มีในตัวมาเพิ่มได้เลย
#     หลังเพิ่มเสร็จสามารถกำหนดระดับความหายาก, เวลาค้นหา, เสียงดรอป และกล่องที่จะให้ดรอปได้ทันที
# =========================================================================

