# =========================================================================
# Luminaris: Operation Vanilla Extraction Core Engine (L.O.V.E)
# การกำหนดค่ากระเป๋านิรภัย (Safe Cases / Secure Containers Configuration)
# =========================================================================
#
# คำอธิบายภาพรวม:
# ไฟล์นี้ใช้สำหรับตั้งค่าโปรไฟล์กระเป๋านิรภัย (Secure Containers) ซึ่งเป็นไอเทม
# ทางยุทธวิธีที่ช่วยปกป้องไอเทมล้ำค่าของผู้เล่นไม่ให้สูญหายเมื่อถูกกำจัด (K.I.A.)
# หรือหมดเวลาการสกัด (M.I.A.) โดยไอเทมภายในกระเป๋าจะถูกส่งคืนให้ผู้เล่นอย่างปลอดภัย
#
# วิธีการตั้งค่าแต่ละพารามิเตอร์:
# -------------------------------------------------------------------------
# display_name:
#   ชื่อของไอเทมกระเป๋านิรภัยที่แสดงผลในช่องเก็บของ รองรับ MiniMessage แบบเต็มรูปแบบ
#   (สามารถใส่แท็กสี, การไล่เฉดสี เช่น <gradient:#00FFA3:#00B8FF>...</gradient>)
#
# title:
#   หัวข้อที่จะปรากฏบนแถบด้านบนของหน้าต่าง GUI เมื่อผู้เล่นคลิกขวาเปิดกระเป๋านิรภัย
#   รองรับ MiniMessage เช่นกัน
#
# material:
#   ชนิดของไอเทม Minecraft (Bukkit Material Name) เช่น BUNDLE, ENDER_CHEST, CHEST
#
# custom_model_data:
#   รหัส CustomModelData สำหรับเชื่อมโยงกับ Resource Pack (โมเดล 3 มิติ หรือ Texture พิเศษ)
#   (หากไม่มีการใช้งาน Resource Pack สามารถตัดออกหรือปล่อยไว้ตามเดิมได้)
#
# capacity:
#   จำนวนช่องเก็บของที่ผู้เล่นสามารถใส่ไอเทมได้จริงในกระเป๋าใบนี้
#   - 4  ช่อง = ขนาดกะทัดรัด (2x2)
#   - 6  ช่อง = ขนาดมาตรฐาน (3x2)
#   - 9  ช่อง = ขนาดใหญ่เสริมเกราะ (3x3)
#   - 12 ช่อง = ตู้เซฟนิรภัยขนาดใหญ่พิเศษ (4x3)
#   หมายเหตุ: ช่องที่เกินจากค่า capacity ในหน้าต่าง GUI จะถูกล็อคด้วยไอเทมสีเทาโดยอัตโนมัติ
#
# keeps_on_death:
#   กำหนดว่าจะให้กระเป๋าและไอเทมข้างในคงอยู่เมื่อผู้เล่นเสียชีวิตหรือไม่ (true/false)
#   - true  : ไอเทมและตัวกระเป๋าจะไม่หล่นเป็นกล่องศพ (Corpse Crate) และจะคืนกลับให้ผู้เล่นทันที
#   - false : ไอเทมจะหล่นตกไว้ที่จุดเกิดเหตุ
#
# ระบบความปลอดภัยเพิ่มเติม:
#   - ระบบมีระบบป้องกันการซ้อนกระเป๋า (Anti-Nesting Protection) โดยจะบล็อกการนำกระเป๋านิรภัย
#     ใส่ซ้อนเข้าไปในกระเป๋านิรภัยใบอื่นอย่างเด็ดขาดเพื่อป้องกันช่องโหว่การปั๊มช่องเก็บของ
#
# คำสั่งที่มีประโยชน์ในเกม:
#   - /ext case list                      : แสดงรายชื่อกระเป๋านิรภัยทั้งหมดที่ลงทะเบียนไว้
#   - /ext case give <ผู้เล่น> <รหัสกระเป๋า> : มอบกระเป๋านิรภัยให้แก่ผู้เล่นที่ระบุ
# =========================================================================

safe_cases:
  alpha_pouch:
