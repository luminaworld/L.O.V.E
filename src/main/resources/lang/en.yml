  log_success: "<color:#55FF55>✔ Successfully populated </color><color:#FFFF55>{successful}/{total}</color> <color:#55FF55>containers across regions in world </color><color:#55FFFF>{world}</color> <color:#AAAAAA>(template: {template})</color>"
  log_container_error: "<color:#FF5555>Failed to populate container <color:#FFFF55>{id}</color> at <color:#55FFFF>({x}, {y}, {z})</color>:</color> <color:#FFFFFF>{error}</color>"
