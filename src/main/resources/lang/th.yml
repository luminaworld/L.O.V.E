  command_list_entry: "<color:#555555>▪ </color><color:#FFFF55>{match_id}</color> <color:#AAAAAA>|</color> <color:#55FFFF>{template}</color> <color:#AAAAAA>|</color> <color:#FFFFFF>{world}</color> <color:#AAAAAA>|</color> <color:#55FF55>{players} ผู้เล่น</color> <color:#AAAAAA>| เวลาคงเหลือ: </color><color:#FF5555>{time_left}</color>"
  command_status_header: "<gradient:#00FFA3:#00B8FF><bold>สถานะแมตช์: {match_id}</bold></gradient>"
