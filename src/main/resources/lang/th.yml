    must_be_template_world: "<color:#FF5555>คุณต้องใช้งานเครื่องมือนี้ในแผนที่เทมเพลตเท่านั้น</color>"
    no_armor_stand: "<color:#FF5555>ไม่สามารถตั้งค่า ArmorStand ให้เป็นตู้เซฟได้</color>"


