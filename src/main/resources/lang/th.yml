# -------------------------------------------------------------------------
# ส่วนที่ 11: ระบบกล่องศพผู้เล่น (Corpse Box)
# กล่องที่ถูกสร้างขึ้น ณ จุดที่ผู้เล่นเสียชีวิตเพื่อเก็บรักษาไอเทมไว้
# -------------------------------------------------------------------------
corpse:
  chest_title: "<color:#FF5555><bold>กล่องศพ:</bold> <color:#FFFF55>{player}</color></color>"
  overflow_title: "<color:#FF5555><bold>กล่องศพส่วนเกิน:</bold> <color:#FFFF55>{player}</color></color>"
  log_spawn_error: "<color:#FF5555>ล้มเหลวในการสร้างกล่องศพสำหรับ <color:#FFFF55>{player}</color> ที่พิกัด <color:#55FFFF>{location}</color>: <color:#FFFFFF>{error}</color></color>"

# -------------------------------------------------------------------------
# ส่วนที่ 12: การเสียชีวิตและการส่งคืนไอเทม (Death & Restoration)
# -------------------------------------------------------------------------
death:
  player_kia: "<color:#FF5555><bold>[เสียชีวิตในการรบ]</bold> คุณถูกกำจัดแล้ว! ไอเทมของคุณถูกเก็บรักษาไว้ในกล่องศพ ณ จุดที่คุณเสียชีวิต</color>"
  safe_cases_restored: "<color:#55FF55>✔ <bold>[คืนกระเป๋านิรภัยสำเร็จ]</bold> ไอเทมและกระเป๋าที่ได้รับการปกป้องทั้งหมดถูกส่งคืนสู่ช่องเก็บของของคุณแล้ว!</color>"
  extracted_success: "<color:#55FF55><bold>[สกัดหลบหนีสำเร็จ]</bold> ยืนยันการอพยพ สถานะทางยุทธวิธี: รอดชีวิต</color>"

# -------------------------------------------------------------------------
# ส่วนที่ 13: เมนูกระเป๋านิรภัย (Safe Case Container)
# ข้อความในหน้าต่าง GUI กระเป๋านิรภัย, ช่องล็อค, และการป้องกันนำกระเป๋าซ้อนกัน
# -------------------------------------------------------------------------
safe_case:
  locked_slot_name: "<color:#555555>▪ <color:#AAAAAA>ช่องเก็บของที่ล็อคอยู่</color></color>"
  locked_slot_lore_1: "<color:#555555>ช่องนี้เกินความจุของคอนเทนเนอร์นี้</color>"
  locked_slot_lore_2: "<color:#555555>อัปเกรดเป็นกระเป๋านิรภัยขนาดใหญ่ขึ้นเพื่อปลดล็อค</color>"
  lore_capacity: "<color:#555555>▪ <color:#AAAAAA>ความจุ: <color:#FFFF55>{capacity} ช่อง</color></color></color>"
  lore_secure: "<color:#555555>▪ <color:#55FFFF>กระเป๋านิรภัย L.O.V.E</color></color>"
  lore_keeps_on_death: "<color:#555555>▪ <color:#55FF55>คงอยู่หลังการสกัดและเมื่อเสียชีวิต</color></color>"
  lore_lost_on_death: "<color:#555555>▪ <color:#FF5555>สูญหายเมื่อเสียชีวิต</color></color>"
  lore_divider: "<color:#555555>------------------------</color>"
  lore_instruction: "<color:#FFFF55>คลิกขวาเพื่อเปิดช่องเก็บของ</color>"
  default_title: "<color:#FFAA00>กระเป๋านิรภัย</color>"
  error_nesting_cursor: "<color:#FF5555>✕ คุณไม่สามารถวางกระเป๋านิรภัยซ้อนในกระเป๋านิรภัยอื่นได้!</color>"
  error_nesting_shift: "<color:#FF5555>✕ คุณไม่สามารถเก็บกระเป๋านิรภัยซ้อนในกระเป๋านิรภัยอื่นได้!</color>"
  error_hotbar_swap: "<color:#FF5555>✕ ไม่อนุญาตให้สลับกระเป๋านิรภัยจาก Hotbar เข้าสู่ช่องเก็บของ!</color>"
  error_nesting_drag: "<color:#FF5555>✕ คุณไม่สามารถลากกระเป๋านิรภัยลงในกระเป๋านิรภัยอื่นได้!</color>"

# -------------------------------------------------------------------------
# ส่วนที่ 14: ระบบสุ่มไอเทมลงคอนเทนเนอร์ (Loot Populator)
# บันทึกคอนโซลแสดงสถานะการโหลดชังก์และการสุ่มเติมไอเทม
# -------------------------------------------------------------------------
loot:
  log_no_containers: "<color:#AAAAAA>ไม่มีคอนเทนเนอร์ที่ลงทะเบียนไว้สำหรับเทมเพลต </color><color:#FFFF55>{template}</color> <color:#AAAAAA>ในโลก {world}</color>"
  log_initiating: "<color:#AAAAAA>กำลังเริ่มสุ่มเติมไอเทมตามภูมิภาคสำหรับ </color><color:#FFFF55>{count}</color> <color:#AAAAAA>คอนเทนเนอร์ในโลก </color><color:#55FFFF>{world}</color><color:#AAAAAA>...</color>"
  log_chunk_error: "<color:#FF5555>ล้มเหลวในการโหลดชังก์แบบอะซิงโครนัส <color:#55FFFF>({x}, {z})</color> สำหรับคอนเทนเนอร์ <color:#FFFF55>{id}</color>: <color:#FFFFFF>{error}</color></color>"
  log_success: "<color:#55FF55>✔ สุ่มเติมไอเทมสำเร็จใน </color><color:#FFFF55>{successful}/{total}</color> <color:#55FF55>คอนเทนเนอร์ทั่วทุกภูมิภาคในโลก </color><color:#55FFFF>{world}</color> <color:#AAAAAA>(เทมเพลต: {template})</color>"
  log_container_error: "<color:#FF5555>ล้มเหลวในการเติมไอเทมในคอนเทนเนอร์ <color:#FFFF55>{id}</color> ที่พิกัด <color:#55FFFF>({x}, {y}, {z})</color>:</color> <color:#FFFFFF>{error}</color>"
  log_not_container_block: "<color:#FFFF55>บล็อกที่พิกัด ({x}, {y}, {z}) ใน {world} คือ {material} ซึ่งไม่ใช่คอนเทนเนอร์ (หีบ, ถัง) จึงข้ามคอนเทนเนอร์ '{id}'</color>"
  log_category_not_found: "<color:#FFFF55>ไม่พบหมวดหมู่ '{category}' สำหรับคอนเทนเนอร์ '{id}' ใน ContainerRegistry ปล่อยให้ว่างเปล่า</color>"
  log_no_items_in_category: "<color:#FFFF55>ไม่มีไอเทมที่มี weight > 0 ในหมวดหมู่ '{category}' (คอนเทนเนอร์: '{id}') ปล่อยให้ว่างเปล่า</color>"

# -------------------------------------------------------------------------
# ส่วนที่ 15: ระบบจัดการโลกจำลองชั่วคราว (Instance World Service)
# บันทึกคอนโซลการคัดลอกเทมเพลต, เมานต์โลก, และปลดระวางเมื่อจบเกม
# -------------------------------------------------------------------------
world:
  log_preparing: "<color:#AAAAAA>กำลังเตรียมโลกจำลองชั่วคราว </color><color:#FFFF55>{instance}</color> <color:#AAAAAA>จากเทมเพลต </color><color:#55FFFF>{template}</color><color:#AAAAAA>...</color>"
  log_template_not_found: "<color:#FF5555>ไม่พบโฟลเดอร์โลกเทมเพลตสำหรับ '<color:#FFFF55>{template}</color>'!</color>"
  log_world_creator_null: "<color:#FF5555>ล้มเหลวในการโหลดโลกจำลอง '<color:#FFFF55>{instance}</color>'!</color>"
  log_mounted: "<color:#55FF55>✔ เปิดใช้งานโลกจำลองชั่วคราวสำเร็จ </color><color:#FFFF55>{instance}</color> <color:#AAAAAA>(โลก: {world})</color>"
  log_load_error: "<color:#FF5555>เกิดข้อผิดพลาดไม่คาดคิดขณะโหลดโลกจำลอง <color:#FFFF55>{instance}</color> บน Global Region: <color:#FFFFFF>{error}</color></color>"
  log_copy_error: "<color:#FF5555>ล้มเหลวในการคัดลอกโฟลเดอร์เทมเพลต '<color:#FFFF55>{template}</color>' แบบอะซิงโครนัส: <color:#FFFFFF>{error}</color></color>"
  log_decommissioning: "<color:#AAAAAA>กำลังเริ่มต้นปลดระวางโลกจำลอง </color><color:#FFFF55>{world}</color><color:#AAAAAA>...</color>"
  log_unloading: "<color:#AAAAAA>กำลังถอดการโหลดโลก </color><color:#FFFF55>{world}</color> <color:#AAAAAA>(doSave = false)...</color>"
  log_unload_false: "<color:#FFFF55>Bukkit.unloadWorld ส่งค่าคืนเป็น false สำหรับ '{world}' กำลังดำเนินการลบไฟล์จากดิสก์ต่อไป...</color>"
  log_unload_error: "<color:#FF5555>ล้มเหลวระหว่างการถอดการโหลดโลก <color:#FFFF55>{world}</color> บน Global Region: <color:#FFFFFF>{error}</color></color>"
  log_evacuation_error: "<color:#FF5555>เกิดข้อผิดพลาดในการอพยพผู้เล่น <color:#FFFF55>{player}</color>: <color:#FFFFFF>{error}</color></color>"
  log_folder_deleted: "<color:#55FF55>✔ ลบโฟลเดอร์โลกจำลองสำเร็จ: </color><color:#FFFF55>{folder}</color>"
  log_folder_deleted_attempt: "<color:#55FF55>✔ ลบโฟลเดอร์โลกจำลองสำเร็จ: </color><color:#FFFF55>{folder}</color> <color:#AAAAAA>(ความพยายามที่ {attempt})</color>"
  log_delete_retry_warning: "<color:#FF5555>ไม่สามารถลบโฟลเดอร์ <color:#FFFF55>{folder}</color> ได้อย่างสมบูรณ์หลังพยายาม {retries} ครั้ง ตั้งเวลาลบเมื่อปิดเซิร์ฟเวอร์ (deleteOnExit)</color>"

# -------------------------------------------------------------------------
# ส่วนที่ 16: ระบบจัดเก็บข้อมูลเทมเพลต (Template Storage)
# -------------------------------------------------------------------------
storage:
  log_template_load_error: "<color:#FF5555>ล้มเหลวในการโหลดข้อมูลเทมเพลตจาก <color:#FFFF55>{path}</color>: <color:#FFFFFF>{error}</color></color>"
  log_template_save_error: "<color:#FF5555>ล้มเหลวในการบันทึก map_data.yml สำหรับ <color:#FFFF55>{template}</color> แบบอะซิงโครนัส: <color:#FFFFFF>{error}</color></color>"

# -------------------------------------------------------------------------
# ส่วนที่ 17: ระบบแปลงข้อมูลไอเทม (ItemStack Serializer)
# -------------------------------------------------------------------------
serializer:
  log_serialize_error: "<color:#FF5555>ล้มเหลวในการแปลงอาร์เรย์ ItemStack เป็น Base64: <color:#FFFFFF>{error}</color></color>"
  log_deserialize_error: "<color:#FF5555>ล้มเหลวในการแปลง Base64 กลับเป็นอาร์เรย์ ItemStack: <color:#FFFFFF>{error}</color></color>"

# -------------------------------------------------------------------------
# ส่วนที่ 18: ระดับความหายากของไอเทม (Item Rarity)
# -------------------------------------------------------------------------
rarity:
  common: "ทั่วไป"
  uncommon: "ไม่ธรรมดา"
  rare: "หายาก"
  epic: "มหากาพย์"
  legendary: "ตำนาน"
