    configured_success: "<color:#55FF55>✔ ตั้งค่าตู้เซฟสำเร็จ! ด้านหน้าจอ: <color:#FFFF55>{face}</color> (หมวดหมู่: <color:#55FFFF>{category}</color>)</color>"
