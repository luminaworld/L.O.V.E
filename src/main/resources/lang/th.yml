  command_no_valid_players: "<color:#FF5555>ไม่พบผู้เล่นออนไลน์ที่ถูกต้องสำหรับส่งเข้าแมตช์</color>"
  command_initializing: "<color:#FFFF55>⏳ กำลังเตรียมแมตช์สำหรับเทมเพลต </color><color:#55FFFF>{template}</color><color:#FFFF55> โดยมีเจ้าหน้าที่ </color><color:#FFFFFF>{count}</color><color:#FFFF55> นาย...</color>"
  command_launched: "<color:#55FF55>✔ เริ่มแมตช์ </color><color:#FFFF55>{match_id}</color><color:#55FF55> สำเร็จในโลก </color><color:#55FFFF>{world}</color><color:#55FF55>!</color>"
  command_launch_failed: "<color:#FF5555>✕ ล้มเหลวในการเริ่มแมตช์: <color:#FFFFFF>{error}</color></color>"
  command_stop_usage: "<color:#FF5555>วิธีใช้: </color><color:#FFFF55>/{label} match stop <รหัสแมตช์></color>"
  command_stopped: "<color:#55FF55>✔ ยุติและปลดระวางแมตช์ </color><color:#FFFF55>{match_id}</color><color:#55FF55> เรียบร้อยแล้ว</color>"
  command_not_found: "<color:#FF5555>ไม่พบแมตช์ที่เปิดอยู่ด้วยรหัส: <color:#FFFF55>{match_id}</color></color>"
  command_list_empty: "<color:#AAAAAA>ขณะนี้ไม่มีแมตช์การสกัดที่กำลังดำเนินอยู่</color>"
