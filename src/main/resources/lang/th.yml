  log_early_teardown: "<color:#FFFF55>เจ้าหน้าที่ทั้งหมดสกัดสำเร็จหรือเสียชีวิตในแมตช์ {match_id} เริ่มต้นการปิดรอบก่อนเวลา...</color>"
