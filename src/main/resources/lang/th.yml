  command_help_start: "<color:#FFFF55>/{label} match start <รหัสเทมเพลต> [รายชื่อผู้เล่น...]</color> <color:#AAAAAA>- ส่งผู้เล่นเข้าสู่แมตช์การสกัด</color>"
  command_help_stop: "<color:#FFFF55>/{label} match stop <รหัสแมตช์></color>               <color:#AAAAAA>- บังคับยุติการทำงานของแมตช์</color>"
