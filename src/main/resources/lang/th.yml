  log_initiating: "<color:#AAAAAA>กำลังเริ่มสุ่มเติมไอเทมตามภูมิภาคสำหรับ </color><color:#FFFF55>{count}</color> <color:#AAAAAA>คอนเทนเนอร์ในโลก </color><color:#55FFFF>{world}</color><color:#AAAAAA>...</color>"
