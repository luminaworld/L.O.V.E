# =========================================================================
# Luminaris: Operation Vanilla Extraction Core Engine (L.O.V.E)
# ไฟล์ภาษาและการแปล: ภาษาไทย (Thai Localization: th.yml)
# =========================================================================
#
# คำแนะนำการแก้ไขและการจัดรูปแบบข้อความ:
# 1. ข้อความทั้งหมดในไฟล์นี้ใช้มาตรฐาน Adventure MiniMessage:
#    - ข้อความสีเดี่ยว: ใช้รูปแบบ <color:#HEX>ข้อความ</color> (เช่น <color:#F3CFFD>ตัวอย่าง</color>)
#    - ข้อความไล่เฉดสี: ใช้รูปแบบ <gradient:#HEX1:#HEX2>ข้อความ</gradient> (เช่น <gradient:#00FFA3:#00B8FF>ตัวอย่าง</gradient>)
#    - รูปแบบตัวอักษร: <bold> หรือ <b>, <italic> หรือ <i>, <underlined> หรือ <u>
# 2. ตัวแปรในข้อความจะอยู่ในรูปแบบปีกกา เช่น {player}, {count}, {template}, {time}
#    ห้ามแก้ไขหรือลบชื่อตัวแปรภายในเครื่องหมาย { } เนื่องจากระบบจะนำค่าจริงมาแทนที่
# =========================================================================

# -------------------------------------------------------------------------
# ส่วนที่ 1: คำนำหน้าชื่อระบบ (Prefixes)
# ใช้แสดงหน้าข้อความในแชทและคอนโซลเพื่อระบุโมดูลย่อยที่ส่งข้อความ
# -------------------------------------------------------------------------
prefix:
  # คำนำหน้าระบบแกนหลัก LuminarisCore
  core: "<gradient:#00FFA3:#00B8FF><bold>[LuminarisCore]</bold></gradient>"
  # คำนำหน้าสำหรับเครื่องมือมาร์กเกอร์จุดวางคอนเทนเนอร์
  marker: "<gradient:#00FFA3:#00B8FF><bold>✔ [มาร์กเกอร์ L.O.V.E]</bold></gradient>"
  # คำนำหน้าระบบการจัดการแมตช์ (ข้อความทั่วไป)
  match: "<gradient:#00FFA3:#00B8FF><bold>[LuminarisMatch]</bold></gradient>"
  # คำนำหน้าระบบการจัดการแมตช์ (ข้อความเตือน)
  match_warn: "<gradient:#FFAA00:#FF5500><bold>[LuminarisMatch]</bold></gradient>"
  # คำนำหน้าระบบการจัดการแมตช์ (ข้อผิดพลาด)
  match_error: "<gradient:#FF0055:#FF5555><bold>[LuminarisMatch]</bold></gradient>"
  # คำนำหน้าระบบจัดการโลกจำลอง InstanceWorld (ข้อความทั่วไป)
  world: "<gradient:#00FFA3:#00B8FF><bold>[LuminarisWorld]</bold></gradient>"
  # คำนำหน้าระบบจัดการโลกจำลอง (ข้อความเตือน)
  world_warn: "<gradient:#FFAA00:#FF5500><bold>[LuminarisWorld]</bold></gradient>"
  # คำนำหน้าระบบจัดการโลกจำลอง (ข้อผิดพลาด)
  world_error: "<gradient:#FF0055:#FF5555><bold>[LuminarisWorld]</bold></gradient>"
  # คำนำหน้าระบบสุ่มไอเทมลงกล่อง LootPopulator (ข้อความทั่วไป)
  loot: "<gradient:#00FFA3:#00B8FF><bold>[LootPopulator]</bold></gradient>"
  # คำนำหน้าระบบสุ่มไอเทม (ข้อความเตือน)
  loot_warn: "<gradient:#FFAA00:#FF5500><bold>[LootPopulator]</bold></gradient>"
  # คำนำหน้าระบบสุ่มไอเทม (ข้อผิดพลาด)
  loot_error: "<gradient:#FF0055:#FF5555><bold>[LootPopulator]</bold></gradient>"

# -------------------------------------------------------------------------
# ส่วนที่ 2: ข้อความทั่วไป (General Messages)
# ข้อความพื้นฐานที่ใช้ร่วมกันในหลายส่วน เช่น การแจ้งเตือนสิทธิ์, เส้นคั่น
# -------------------------------------------------------------------------
general:
  divider: "<color:#555555>----------------------------------------</color>"
  divider_long: "<color:#555555>================================================================</color>"
  divider_long_sub: "<color:#555555>----------------------------------------------------------------</color>"
  divider_editor: "<color:#555555>==================================================</color>"
  divider_editor_sub: "<color:#555555>--------------------------------------------------</color>"
  no_permission: "<color:#FF5555>คุณไม่มีสิทธิ์ในการใช้งานคำสั่งนี้</color>"
  player_only: "<color:#FF5555>❌ คำสั่งนี้สามารถใช้งานได้โดยผู้เล่นในเกมเท่านั้น</color>"
  player_not_found: "<color:#FF5555>ไม่พบผู้เล่น: <color:#FFFF55>{player}</color></color>"
  all: "<color:#AAAAAA>ทั้งหมด</color>"

# -------------------------------------------------------------------------
# ส่วนที่ 3: แบนเนอร์เริ่มต้นและปิดระบบ (Banner)
# ข้อความ ASCII Art และข้อมูลโมดูลที่แสดงบนคอนโซลขณะเซิร์ฟเวอร์เปิดหรือปิด
# -------------------------------------------------------------------------
banner:
  startup: |
    <gradient:#00FFA3:#00B8FF><bold> LUMINARIS OPERATION VANILLA EXTRACTION (L.O.V.E) </bold></gradient>
    <color:#555555>================================================================</color>
    <gradient:#00FFA3:#00B8FF><bold>        __         ______     __   __     ______    </bold></gradient>
    <gradient:#00FFA3:#00B8FF><bold>       /\ \       /\  __ \   /\ \ / /    /\  ___\   </bold></gradient>
    <gradient:#00FFA3:#00B8FF><bold>       \ \ \____  \ \ \/\ \  \ \ \'/     \ \  __\   </bold></gradient>
    <gradient:#00FFA3:#00B8FF><bold>        \ \_____\  \ \_____\  \ \__|      \ \_____\ </bold></gradient>
    <gradient:#00FFA3:#00B8FF><bold>         \/_____/   \/_____/   \/_/        \/_____/ </bold></gradient>
    <color:#555555>================================================================</color>
    <color:#AAAAAA> Core Engine Version: </color><color:#55FFFF>{version}</color>
    <color:#AAAAAA> Status:              </color><color:#55FF55><bold>ACTIVE</bold></color>
    <color:#555555>================================================================</color>
  shutdown: |
    <color:#555555>================================================================</color>
    <gradient:#FF416C:#8A2387><bold>[LuminarisCore] Disabling Extraction Engine (L.O.V.E)...</bold></gradient>
    <color:#AAAAAA>Cancelling active regional and asynchronous tasks...</color>
    <color:#FF5555><bold>Status: OFFLINE</bold></color>
    <color:#555555>================================================================</color>

# -------------------------------------------------------------------------
# ส่วนที่ 4: คำสั่งทั่วไปของระบบ (/ext)
# ข้อความตอบกลับสำหรับคำสั่ง reload, status, help, case, และ chest
# -------------------------------------------------------------------------
command:
  reload:
    success: "<color:#55FF55>✔ [LuminarisCore] โหลดการตั้งค่าและฐานข้อมูลระบบทั้งหมดใหม่เรียบร้อยแล้ว!</color>"
  unknown_subcommand: "<color:#FF5555>ไม่พบคำสั่งย่อย: <color:#FFFF55>{subcommand}</color> ใช้ </color><color:#FFFF55>/{label} help</color><color:#FF5555> เพื่อดูคำสั่งที่ใช้งานได้</color>"
  status:
    title: "<gradient:#00FFA3:#00B8FF><bold>สถานะระบบสกัด LUMINARIS EXTRACTION ENGINE</bold></gradient>"
    version: "<color:#AAAAAA>เวอร์ชัน:</color> <color:#FFFFFF>{version}</color>"
    threading: "<color:#AAAAAA>รูปแบบเธรด:</color> {platform}"
    platform_folia: "<gradient:#FF0055:#FFAA00><bold>FOLIA</bold></gradient> <color:#AAAAAA>(แบ่งเธรดตามภูมิภาค Multi-Threaded)</color>"
    platform_paper: "<gradient:#00D2FF:#3A7BD5><bold>PAPER</bold></gradient> <color:#AAAAAA>(ตัวจัดการงานมาตรฐาน Universal Scheduler)</color>"
    items: "<color:#AAAAAA>ไอเทมการสกัดที่เปิดใช้งาน:</color> <color:#FFFF55>{count}</color>"
    categories: "<color:#AAAAAA>หมวดหมู่คอนเทนเนอร์:</color> <color:#FFFF55>{count}</color>"
    cases: "<color:#AAAAAA>โปรไฟล์กระเป๋านิรภัย:</color> <color:#FFFF55>{count}</color>"
    instances: "<color:#AAAAAA>แมตช์ที่กำลังดำเนินการ:</color> <color:#FFFF55>{count}</color>"
  help:
    title: "<gradient:#00FFA3:#00B8FF><bold>คำสั่งระบบสกัดหลบหนี LUMINARIS (L.O.V.E)</bold></gradient>"
    match_start: "<color:#FFFF55>/ext match start <แผนที่> [ผู้เล่น]</color> <color:#AAAAAA>- เริ่มต้นและเปิดรอบการเล่นการสกัดหลบหนี</color>"
    match_stop: "<color:#FFFF55>/ext match stop <รหัสแมตช์></color>       <color:#AAAAAA>- บังคับยุติการเล่นของแมตช์ที่เปิดอยู่</color>"
    match_list: "<color:#FFFF55>/ext match list</color>                  <color:#AAAAAA>- ดูรายการแมตช์ที่กำลังดำเนินการอยู่</color>"
    chest_get: "<color:#FFFF55>/ext chest get <หมวดหมู่> [ประเภท]</color> <color:#AAAAAA>- รับไอเทมมาร์กเกอร์จุดวางคอนเทนเนอร์ (หีบ/ถัง)</color>"
    chest_list: "<color:#FFFF55>/ext chest list</color>                  <color:#AAAAAA>- ดูรายการมาร์กเกอร์คอนเทนเนอร์ในแผนที่เทมเพลต</color>"
    case_list: "<color:#FFFF55>/ext case list</color>                    <color:#AAAAAA>- แสดงรายการกระเป๋านิรภัยทั้งหมดที่ตั้งค่าไว้</color>"
    case_give: "<color:#FFFF55>/ext case give <ผู้เล่น> <รหัส></color>   <color:#AAAAAA>- มอบกระเป๋านิรภัยให้แก่ผู้เล่น</color>"
    editor: "<color:#FFFF55>/ext editor</color>                         <color:#AAAAAA>- เปิดหน้าต่าง GUI จัดการกล่องดรอปและไอเทมทั้งหมด</color>"
    web: "<color:#FFFF55>/ext web [reload]</color>                     <color:#AAAAAA>- ดูลิงก์หรือสถานะระบบหน้าเว็บตั้งค่าปลั๊กอิน</color>"
    status: "<color:#FFFF55>/ext status</color>                      <color:#AAAAAA>- ดูข้อมูลสถานะระบบหลักและรูปแบบเธรดการทำงาน</color>"
    reload: "<color:#FFFF55>/ext reload</color>                      <color:#AAAAAA>- โหลดไฟล์ไอเทม, หมวดหมู่, เทมเพลต และกระเป๋านิรภัยใหม่ทันที</color>"
    help: "<color:#FFFF55>/ext help</color>                        <color:#AAAAAA>- แสดงคู่มือการใช้งานคำสั่งทั้งหมด</color>"
  case:
    usage: "<color:#FF5555>วิธีใช้: </color><color:#FFFF55>/{label} case <give|list></color>"
    give_usage: "<color:#FF5555>วิธีใช้: </color><color:#FFFF55>/{label} case give <ผู้เล่น> <รหัสกระเป๋า></color>"
    empty_list: "<color:#AAAAAA>ไม่มีการลงทะเบียนโปรไฟล์กระเป๋านิรภัยในระบบ</color>"
    list_header: "<gradient:#00FFA3:#00B8FF><bold>--- รายการกระเป๋านิรภัยที่ลงทะเบียนไว้ ({count}) ---</bold></gradient>"
    list_entry: "<color:#555555>▪ </color><color:#FFFF55>{id}</color> <color:#AAAAAA>-</color> {display_name} <color:#AAAAAA>(ความจุ: </color><color:#55FFFF>{capacity}</color><color:#AAAAAA>, วัตถุดิบ: </color><color:#55FF55>{material}</color><color:#AAAAAA>)</color>"
    unknown_id: "<color:#FF5555>ไม่พบรหัสกระเป๋านิรภัย: <color:#FFFF55>{id}</color> โปรดใช้คำสั่ง </color><color:#FFFF55>/{label} case list</color>"
    give_success_sender: "<color:#55FF55>✔ มอบกระเป๋านิรภัย </color><color:#FFFF55>{id}</color><color:#55FF55> ให้แก่ </color><color:#55FFFF>{player}</color><color:#55FF55> เรียบร้อยแล้ว!</color>"
    give_success_target: "<color:#55FF55>คุณได้รับกระเป๋านิรภัย: </color>"
    unknown_action: "<color:#FF5555>ไม่พบการกระทำ: <color:#FFFF55>{action}</color> วิธีใช้: </color><color:#FFFF55>/{label} case <give|list></color>"
  chest:
    usage: "<color:#FF5555>วิธีใช้: </color><color:#FFFF55>/{label} chest <get|list></color>"
    missing_category: |
      <color:#FF5555>กรุณาระบุรหัสหมวดหมู่!</color>
      <color:#FFFF55>วิธีใช้: </color><color:#FFFFFF>/{label} chest get <รหัสหมวดหมู่> [chest|barrel]</color>
      {hint}
    available_categories: "<color:#AAAAAA>หมวดหมู่ที่ใช้ได้: </color><color:#55FFFF>{categories}</color>"
    no_categories: "<color:#FFFF55>ยังไม่มีหมวดหมู่ที่ลงทะเบียน สร้างหมวดหมู่ได้ด้วย /ext editor createcategory</color>"
    category_notice: "<color:#FFFF55>⚠ ข้อควรระวัง: หมวดหมู่ </color><color:#55FFFF>{category}</color><color:#FFFF55> ยังไม่มีใน ContainerRegistry แต่มาร์กเกอร์จะยังถูกสร้างขึ้น</color>"
    give_success: "<color:#55FF55>✔ มอบเครื่องมือมาร์กเกอร์สำหรับหมวดหมู่ </color><color:#FFFF55>{category}</color> <color:#AAAAAA>({material})</color><color:#55FF55> ให้แก่ </color><color:#55FFFF>{player}</color><color:#55FF55> แล้ว!</color>"
    list_header: "<gradient:#00FFA3:#00B8FF><bold>รายการคอนเทนเนอร์ในแผนที่เทมเพลตที่ลงทะเบียน</bold></gradient>"
    list_empty: "<color:#AAAAAA>ไม่มีแผนที่เทมเพลตที่ลงทะเบียนหรือโหลดไว้</color>"
    list_template_entry: "<color:#555555>▪ </color><color:#FFFF55>{template}</color> <color:#AAAAAA>({display_name}): </color><color:#55FFFF>{count} คอนเทนเนอร์</color>"
    list_container_entry: "   <color:#555555>• </color><color:#AAAAAA>รหัส: </color><color:#FFFFFF>{id}</color> <color:#AAAAAA>| หมวดหมู่: </color><color:#FFFF55>{category}</color> <color:#AAAAAA>| พิกัด: </color><color:#55FFFF>({x}, {y}, {z})</color>"
    unknown_action: "<color:#FF5555>ไม่พบการกระทำ: <color:#FFFF55>{action}</color> วิธีใช้: </color><color:#FFFF55>/{label} chest <get|list></color>"

# -------------------------------------------------------------------------
# ส่วนที่ 5: ตัวแก้ไขในเกม (/ext editor)
# คำสั่งสำหรับแอดมินในการสร้างไอเทม, สร้างหมวดหมู่, และดูรายการในระบบ
# -------------------------------------------------------------------------
editor:
  no_permission: "<color:#FF5555>❌ คุณไม่มีสิทธิ์เข้าถึงเครื่องมือแก้ไขระบบการสกัด</color>"
  unknown_subcommand: "<color:#FF5555>ไม่พบคำสั่งย่อยของตัวแก้ไข: <color:#FFFF55>{subcommand}</color></color> <color:#FFFF55>ใช้ </color><color:#55FFFF>/{label} editor</color><color:#FFFF55> เพื่อเปิดตัวแก้ไข</color>"
  gui:
    main_title: "<gradient:#00FFA3:#00B8FF><bold>เมนูแก้ไขระบบการสกัด (EXTRACTION EDITOR)</bold></gradient>"
    btn_containers: "<gradient:#FFAA00:#FF5500><bold>รูปแบบกล่องดรอป (Box Types)</bold></gradient>"
    containers_lore_1: "<color:#AAAAAA>จัดการรูปแบบกล่องดรอป (กล่องธรรมดา, แอร์ดรอป, ตู้เซฟ)</color>"
    containers_lore_2: "<color:#AAAAAA>กำหนดจำนวนสุ่มไอเทมและเปอร์เซ็นต์โอกาสดรอปตามระดับความหายาก</color>"
    containers_lore_total: "<color:#FFFF55>ลงทะเบียนแล้วทั้งหมด: </color><color:#55FFFF>{count}</color>"
    containers_lore_action: "<color:#55FF55>▶ คลิกเพื่อเปิดเมนูจัดการกล่องดรอป</color>"
    btn_items: "<gradient:#00FFA3:#00B8FF><bold>คลังไอเทมดรอป (Drop Items)</bold></gradient>"
    items_lore_1: "<color:#AAAAAA>จัดการไอเทมทั้งหมดที่มีโอกาสดรอปจากกล่องในเกม</color>"
    items_lore_2: "<color:#AAAAAA>เพิ่มไอเทมจากตัวผู้เล่น, กำหนดความหายาก, ราคา และกล่องที่ดรอป</color>"
    items_lore_total: "<color:#FFFF55>ลงทะเบียนแล้วทั้งหมด: </color><color:#55FFFF>{count}</color>"
    items_lore_action: "<color:#55FF55>▶ คลิกเพื่อเปิดเมนูจัดการคลังไอเทม</color>"
    btn_reload: "<color:#FFFF55><bold>โหลดข้อมูลระบบใหม่</bold></color>"
    reload_lore_1: "<color:#AAAAAA>โหลด categories.yml, items.yml และไฟล์ภาษาใหม่ทันที</color>"
    reload_lore_action: "<color:#55FF55>▶ คลิกเพื่อโหลดการตั้งค่าใหม่</color>"
    reload_success: "<color:#55FF55>✔ โหลดข้อมูลการตั้งค่าใหม่สำเร็จเรียบร้อย!</color>"
    btn_close: "<color:#FF5555><bold>ปิดเมนู</bold></color>"
    btn_back: "<color:#FFFF55><bold>◀ ย้อนกลับ</bold></color>"
    btn_next_page: "<color:#55FFFF><bold>หน้าถัดไป ▶</bold></color>"
    btn_prev_page: "<color:#55FFFF><bold>◀ หน้าก่อนหน้า</bold></color>"
    page_info: "<color:#AAAAAA>หน้า </color><color:#FFFF55>{current}</color><color:#AAAAAA> / </color><color:#55FFFF>{total}</color>"
    containers_title: "<gradient:#FFAA00:#FF5500><bold>จัดการรูปแบบกล่องดรอป</bold></gradient>"
    btn_add_container: "<gradient:#00FFA3:#00B8FF><bold>+ สร้างรูปแบบกล่องใหม่</bold></gradient>"
    container_add_lore_1: "<color:#AAAAAA>คลิกเพื่อสร้างรูปแบบกล่องดรอปใหม่ผ่านหน้าต่าง Dialog</color>"
    container_add_lore_action: "<color:#55FF55>▶ คลิกเพื่อสร้างกล่องใหม่</color>"
    container_card_id: "<color:#AAAAAA>รหัส: </color><color:#FFFF55>{id}</color>"
    container_card_rolls: "<color:#AAAAAA>จำนวนสุ่มไอเทม: </color><color:#55FF55>{min} - {max} ชิ้น</color>"
    container_card_linked: "<color:#AAAAAA>ไอเทมที่ผูกกับกล่องนี้: </color><color:#55FFFF>{count} รายการ</color>"
    container_card_rarity_header: "<color:#FFAA00><bold>โอกาสดรอปตามระดับความหายาก:</bold></color>"
    container_card_rarity_entry: "{tag}▪ {name}: </color><color:#FFFFFF>{pct}%</color>"
    container_card_click_edit: "<color:#55FF55>คลิกซ้าย:</color> <color:#AAAAAA>เปิดหน้าต่างแก้ไขกล่อง (GUI)</color>"
    container_card_click_marker: "<color:#55FFFF>คลิกขวา:</color> <color:#AAAAAA>รับบล็อกมาร์กเกอร์จุดวาง</color>"
    container_card_click_delete: "<color:#FF5555>Shift+คลิกขวา:</color> <color:#AAAAAA>ลบรูปแบบกล่องนี้</color>"
    container_created: "<color:#55FF55>✔ สร้างรูปแบบกล่องใหม่สำเร็จ: <color:#FFFF55>{id}</color></color>"
    container_deleted: "<color:#FF5555>🗑 ลบรูปแบบกล่องดรอปเรียบร้อย: <color:#FFFF55>{id}</color></color>"
