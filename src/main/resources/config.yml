# =========================================================================
# Luminaris: Operation Vanilla Extraction Core Engine (L.O.V.E)
# ไฟล์กำหนดค่าหลักของระบบ (Main System Configuration)
# =========================================================================
#
# คำอธิบายภาพรวม:
# ไฟล์นี้เป็นไฟล์ตั้งค่าหลักสำหรับปลั๊กอิน LuminarisCore ซึ่งควบคุมการทำงานของ
# ระบบสกัดหลบหนี (Extraction Gamemode) ทั้งหมดบนเซิร์ฟเวอร์ Paper และ Folia
#
# =========================================================================
# การตั้งค่าภาษา (Language Configuration)
# =========================================================================
#
# กำหนดภาษาเริ่มต้นที่ระบบจะนำมาใช้แสดงผลสำหรับ:
#   - ข้อความแจ้งเตือนผู้เล่น (Chat & Actionbar)
#   - ข้อความสถานะคำสั่ง (Commands & Feedback)
#   - หน้าต่างเมนูแก้ไขในเกม (In-game Dialogs UI)
#   - ข้อความบันทึกการทำงานในคอนโซล (Console Logs)
#
# แพ็กเกจภาษาเริ่มต้นที่ติดตั้งมาพร้อมปลั๊กอิน:
#   - en : ภาษาอังกฤษ (English)
#   - th : ภาษาไทย (Thai)
#
# คุณสามารถสร้างชุดภาษาเพิ่มเติมได้ตามต้องการ โดยสร้างไฟล์ YAML ไว้ในโฟลเดอร์:
# plugins/LuminaExtractionCore/lang/<รหัสภาษา>.yml (เช่น es.yml, fr.yml, ja.yml)
# หากมีข้อความใดที่ไม่มีในไฟล์ภาษาที่เลือก ระบบจะใช้ภาษาอังกฤษ (en) เป็นภาษาสำรองโดยอัตโนมัติ
#
language: "en"

# =========================================================================
# ระบบสีและการจัดรูปแบบข้อความ (MiniMessage Formatting System)
# =========================================================================
# ปลั๊กอินนี้ใช้ระบบจัดรูปแบบข้อความ Adventure MiniMessage โดยมีมาตรฐานดังนี้:
#
# 1. ข้อความสีเดี่ยว (Single Color):
#    ใช้รูปแบบแท็กสี Hex: <color:#HEX>ข้อความ</color>
#    ตัวอย่าง:
#      - <color:#F3CFFD>ข้อความสีพาสเทล</color>
#      - <color:#00FFA3>ข้อความสีเขียวนีออน</color>
#      - <color:#FF5555>ข้อความแจ้งเตือนข้อผิดพลาด</color>
#      - <color:#FFFF55>ข้อความไฮไลต์สีเหลือง</color>
#      - <color:#AAAAAA>ข้อความสีเทารายละเอียด</color>
#
# 2. ข้อความไล่เฉดสี (Gradients):
#    ใช้รูปแบบแท็ก: <gradient:#HEX1:#HEX2>ข้อความ</gradient>
#    หรือไล่เฉดสีมากกว่า 2 สี เช่น <gradient:#FF0055:#FFAA00:#00FFA3>...</gradient>
#    ตัวอย่าง:
#      - <gradient:#00FFA3:#00B8FF><bold>[LuminarisCore]</bold></gradient>
#      - <gradient:#FF0055:#FFAA00>คำเตือนสำคัญ</gradient>
#
# 3. รูปแบบตัวอักษรพิเศษ (Text Decorations):
#    <bold> หรือ <b>           : ตัวหนา
#    <italic> หรือ <i>         : ตัวเอียง
#    <underlined> หรือ <u>     : ขีดเส้นใต้
#    <strikethrough> หรือ <s>  : ขีดฆ่าข้อความ
#    <obfuscated> หรือ <obf>   : ตัวอักษรหมุนวนสลับมั่ว
#    <reset> หรือ <r>          : รีเซ็ตสีและรูปแบบตัวอักษร
#
# 4. ฟังก์ชันการโต้ตอบ (Interactive Click & Hover Events):
#    <click:run_command:'/ext help'>คลิกเพื่อดูคำสั่ง</click>
#    <hover:show_text:'<color:#FFFF55>คลิกเพื่อดำเนินการ</color>'>ชี้เมาส์ดูข้อความ</hover>
#
# 5. การรองรับโค้ดสีแบบเดิม (Legacy & Code Compatibility):
#    ระบบรองรับโค้ดสีแบบดั้งเดิม & (เช่น &a, &c, &6, &l, &r), โค้ดสี Hex (&#RRGGBB
#    หรือ &x&r&r&g&g&b&b) และสัญลักษณ์ § โดยระบบจะแปลงเป็น MiniMessage ให้แบบอัตโนมัติ
# =========================================================================
