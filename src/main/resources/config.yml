# =========================================================================
# Luminaris: Operation Vanilla Extraction Core Engine (L.O.V.E)
# ไฟล์กำหนดค่าระบบหลักแบบรวมศูนย์ (Master System Configuration)
# =========================================================================
#
# คำอธิบายภาพรวม:
# ไฟล์นี้เป็นไฟล์ตั้งค่าหลักสำหรับปลั๊กอิน LuminaExtractionCore ซึ่งควบคุมการทำงานของ
# ระบบสกัดหลบหนี (Extraction Gamemode) ทั้งหมดบนเซิร์ฟเวอร์ Paper และ Folia
# ปลั๊กอินนี้รองรับการจัดรูปแบบข้อความด้วย Adventure MiniMessage และ Color Hex ทั้งหมด
#
# =========================================================================

# =========================================================================
# การตั้งค่าภาษา (Language Configuration)
# =========================================================================
# กำหนดภาษาเริ่มต้นที่ระบบจะนำมาใช้แสดงผล (en = ภาษาอังกฤษ, th = ภาษาไทย)
# สามารถเพิ่มภาษาใหม่ได้ที่โฟลเดอร์: plugins/LuminaExtractionCore/lang/<รหัส>.yml
language: "en"

# =========================================================================
# 1. จุดส่งตัวกลับล็อบบี้ (Lobby & Evacuation Destination)
# =========================================================================
# ตำแหน่งพิกัดที่ระบบจะส่งตัวผู้เล่นกลับไป เมื่อ:
#   - สกัดหลบหนีสำเร็จ (Extraction Complete)
#   - แมตช์สิ้นสุดหรือถูกยกเลิก (Match Teardown / Decommission)
#   - ผู้เล่นถูกอพยพออกจากโลกแมตช์ชั่วคราว
# =========================================================================
lobby:
  # ชื่อโลกของล็อบบี้
  world: "world"
  # พิกัดตำแหน่งจุดเกิด
  x: 0.5
  y: 64.0
  z: 0.5
  # มุมมองสายตาของผู้เล่นเมื่อถูกวาร์ปมาถึง
  yaw: 0.0
  pitch: 0.0

# =========================================================================
# 2. ระบบการสกัดหลบหนี (Extraction System Settings)
# =========================================================================
# กำหนดพฤติกรรมของโซนสกัดหลบหนี (Extraction Zones) และการนับถอยหลัง
# =========================================================================
extraction:
  # เวลานับถอยหลังเริ่มต้นสำหรับโซนที่ไม่ได้ระบุเวลาไว้เฉพาะ (หน่วย: วินาที)
  default_countdown_seconds: 10

  # ยกเลิกการสกัดเมื่อผู้เล่นได้รับความเสียหายหรือไม่ (true = ยกเลิก, false = สกัดต่อได้)
  interrupt_on_damage: true

  # ดาเมจขั้นต่ำที่จะทำให้การนับถอยหลังสกัดถูกยกเลิก (0.0 = โดนดาเมจใดๆ ก็ยกเลิกทันที)
  damage_threshold: 0.0

  # เสียงประกอบเมื่อสกัดหลบหนี
  sounds:
    # เสียงเมื่อสกัดหลบหนีสำเร็จและถูกส่งตัวกลับล็อบบี้
    success: "UI_TOAST_CHALLENGE_COMPLETE"
    # เสียงจังหวะนับถอยหลังแต่ละวินาที (เว้นว่างไว้เพื่อปิดเสียง)
    countdown_tick: "UI_BUTTON_CLICK"

# =========================================================================
# 3. ระบบแมตช์และรอบการเล่น (Match Instance Settings)
# =========================================================================
# ควบคุมกฎและการดำเนินเกมในแต่ละรอบการเล่นสกัดหลบหนี
# =========================================================================
match:
  # ระยะเวลาการเล่นในแมตช์เริ่มต้น (หน่วย: วินาที, 1200 วินาที = 20 นาที)
  default_duration_seconds: 1200

  # ปิดและทำลายโลกแมตช์ทันทีเมื่อผู้เล่นทุกคนออกจากรอบครบแล้ว (สกัดสำเร็จหรือตายหมด)
  # true = ปิดทันทีเพื่อประหยัด RAM/CPU, false = รอจนกว่าเวลาแมตช์จะหมด
  early_teardown_when_all_terminal: true

  # การแสดงผลแถบสถานะเวลาด้านบนหน้าจอ (Adventure BossBar)
  bossbar:
    enabled: true
    # สีของแถบ BossBar: RED, BLUE, GREEN, YELLOW, PURPLE, WHITE, PINK
    color: "RED"
    # รูปแบบแถบ: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    overlay: "PROGRESS"

  # การจัดการเมื่อหมดเวลาการสกัด (M.I.A. - Missing In Action)
  timeout:
    # ดาเมจที่สร้างแก่ผู้เล่นที่ไม่สามารถสกัดได้ทันเวลา (100000.0 = กำจัดทันที)
    damage_amount: 100000.0

# =========================================================================
# 4. การจัดการโลกจำลองแมตช์ (Ephemeral Instance World Settings)
# =========================================================================
# ควบคุมการโคลนและจัดการโลกแมตช์ชั่วคราวที่จะถูกสร้างและลบโดยอัตโนมัติ
# =========================================================================
instance_world:
  # ชื่อโฟลเดอร์ต้นฉบับแผนที่เทมเพลต (สัมพัทธ์กับโฟลเดอร์เซิร์ฟเวอร์หลัก)
  templates_folder: "templates_worlds"

  # ชื่อโฟลเดอร์ปลายทางสำหรับวางโลกแมตช์ที่กำลังเล่น
  instances_folder: "instances"

  # จำนวนครั้งสูงสุดในการลองลบโฟลเดอร์โลกแมตช์ซ้ำ เมื่อติด File Lock (แนะนำ 5-15 ครั้ง)
  delete_retry_attempts: 10

  # กฎของโลกแมตช์ (Instance GameRules)
  gamerules:
    # เก็บของไว้กับตัวเมื่อตาย (false = ดรอปของลงกล่องศพตามกฎสกัด)
    keep_inventory: false
    # ให้เวลากลางวัน-กลางคืนเดินตามปกติหรือไม่
    do_daylight_cycle: false
    # สปอว์นมอนสเตอร์ตามธรรมชาติในโลกแมตช์หรือไม่
    do_mob_spawning: false
    # อนุญาตให้มีฝน/พายุฝนฟ้าคะนองหรือไม่
    do_weather_cycle: false
    # กำหนดเวลาของโลกแมตช์ให้คงที่ (6000 = เที่ยงวันสว่างชัดเจน, 18000 = กลางคืนมืดสนิท)
    fixed_time: 6000

# =========================================================================
# 5. ระบบกล่องศพผู้เล่น (Player Corpse Container Settings)
# =========================================================================
# ควบคุมการทำงานเมื่อผู้เล่นเสียชีวิตในสนามรบ
# =========================================================================
corpse:
  # เปิดใช้งานระบบกล่องศพหรือไม่ (true = วางกล่องเก็บของที่จุดตาย, false = ไอเทมหล่นกระจายลงพื้นแบบปกติ)
  enabled: true

  # ชนิดบล็อกคอนเทนเนอร์ที่จะถูกวางเป็นกล่องศพ: CHEST, BARREL, TRAPPED_CHEST
  material: "CHEST"

  # ชนิดบล็อกสำหรับกล่องส่วนขยาย หากไอเทมของผู้เล่นมากกว่า 27 ช่อง
  overflow_material: "CHEST"

  # การจัดการหากไอเทมล้นเกินความจุทั้ง 2 กล่อง (DROP = ดรอปไอเทมส่วนเกินลงพื้น)
  overflow_action: "DROP"

# =========================================================================
# 6. ระบบขอบเรืองแสงกล่องดรอป (Container Highlight & Glowing)
# =========================================================================
# ควบคุมการแสดงผลเส้นขอบเรืองแสงรอบกล่องดรอป พร้อมระบบตรวจจับแนวสายตาป้องกันการมองทะลุกำแพง
# =========================================================================
container_highlight:
  # เปิด/ปิดการทำงานของระบบเรืองแสงทั้งหมด
  enabled: true

  # ระยะห่างสูงสุดที่จะแสดงผลการเรืองแสง (หน่วย: บล็อก)
  max_distance: 16.0

  # ความถี่ในการตรวจสอบแนวสายตา (Ticks: 20 Ticks = 1 วินาที, แนะนำ 4-10 Ticks)
  check_interval_ticks: 6

  # รูปแบบ Entity สำหรับสร้างขอบเรืองแสง:
  #   - BLOCK_DISPLAY : (แนะนำ) ครอบบล็อกพอดี ไม่มี Hitbox ไม่ขัดขวางการคลิกเปิดกล่อง
  #   - SHULKER       : กล่องสี่เหลี่ยมเรืองแสง 1x1x1 แบบดั้งเดิม
  mode: "BLOCK_DISPLAY"

  # บังคับความสว่างสูงสุดของโมเดลกล่องเรืองแสงหรือไม่ (false = อิงแสงในห้องตามธรรมชาติ)
  fullbright: false

  # สีของเส้นขอบเรืองแสงรอบกล่อง (Scoreboard Team Glow Color):
  # ตัวเลือกที่รองรับ: WHITE, GOLD, AQUA, RED, GREEN, YELLOW, LIGHT_PURPLE, DARK_PURPLE, DARK_AQUA
  glow_color: "WHITE"

  # ชื่อ Scoreboard Team ที่ใช้สำหรับระบบเรืองแสง
  team_name: "lumina_glow"

  # โลกที่ต้องการเปิดใช้งานระบบเรืองแสง
  worlds:
    # เปิดใช้งานในแมตช์สกัดหลบหนี (Raid Instance Worlds)
    match: true
    # เปิดใช้งานในโลกเทมเพลตสำหรับแอดมินแก้ไข (Template Worlds)
    template: true

# =========================================================================
# 7. ระบบค้นหากล่องดรอปและเสียงประกอบ (Drop Box Search System)
# =========================================================================
# ควบคุมกลไกการสุ่มค้นหาไอเทมเมื่อเปิดกล่องคอนเทนเนอร์ในแมตช์และระบบจำลอง
# =========================================================================
drop_box:
  # ค่าเริ่มต้นสำหรับกล่องที่ไม่ได้กำหนดเวลาไว้เฉพาะ (หน่วย: วินาที)
  default_search_time_min: 2
  default_search_time_max: 4

  # ชนิดบล็อกที่ใช้ปิดทุกช่องในช่วงเริ่มค้นหากล่อง
  default_covered_material: "BLACK_STAINED_GLASS_PANE"

  # ชนิดบล็อกที่ใช้แสดงในช่องที่มีไอเทมระหว่างค้นหาทีละชิ้น
  default_searching_material: "STONE"

  # เสียงเริ่มต้นขณะค้นหา
  default_search_sound: "BLOCK_STONE_HIT"

  # เสียงเริ่มต้นเมื่อพบไอเทม
  default_reveal_sound: "ENTITY_ITEM_PICKUP"

  # ระยะเวลาการค้นหาไอเทมเริ่มต้นตามระดับความหายาก (หน่วย: วินาที)
  # หากไอเทมนั้นไม่ได้กำหนด search_time ไว้ จะใช้ค่าตามเกรดนี้
  rarity_search_times:
    F: 1
    D: 2
    C: 3
    B: 4
    A: 5
    S: 6

  # เสียงประกอบเมื่อเปิดเจอไอเทมตามระดับความหายาก (Reveal Sound Fallback)
  # หากไอเทมหรือกล่องไม่ได้กำหนดเสียงเฉพาะไว้ ระบบจะเล่นเสียงตามระดับนี้
  rarity_reveal_sounds:
    F: "ENTITY_ITEM_PICKUP"
    D: "BLOCK_NOTE_BLOCK_BELL"
    C: "BLOCK_AMETHYST_BLOCK_CHIME"
    B: "ENTITY_PLAYER_LEVELUP"
    A: "UI_TOAST_CHALLENGE_COMPLETE"
    S: "UI_TOAST_CHALLENGE_COMPLETE"

  # เสียงประกอบอื่นๆ ภายในหน้าต่าง GUI กล่องดรอป
  sounds:
    # เสียงเมื่อค้นหาไอเทมทุกชิ้นในกล่องครบสมบูรณ์
    complete: "ENTITY_EXPERIENCE_ORB_PICKUP"
    # เสียงเมื่อผู้เล่นหยิบไอเทมที่เปิดเจอแล้วเข้ากระเป๋า
    take_item: "ENTITY_ITEM_PICKUP"
    # เสียงแจ้งเตือนเมื่อคลิกช่องที่ยังค้นหาไม่เสร็จ
    click_searching_error: "UI_BUTTON_CLICK"

# =========================================================================
# 8. ระบบกระเป๋านิรภัย (Safe Cases Global Settings)
# =========================================================================
# ควบคุมพฤติกรรมภาพรวมของกระเป๋านิรภัย (กระเป๋าเซฟเก็บของติดตัว)
# =========================================================================
safe_cases_settings:
  # ชนิดไอเทมที่ใช้เป็นตัวปิดบล็อคช่องที่ยังไม่ได้ปลดล็อคในหน้าต่าง GUI กระเป๋านิรภัย
  locked_slot_material: "GRAY_STAINED_GLASS_PANE"

  # ระบบป้องกันการนำกระเป๋านิรภัยใส่ซ้อนในกระเป๋านิรภัยใบอื่น (Anti-Nesting Protection)
  # true = บล็อกการซ้อนกระเป๋าทุกกรณีเพื่อป้องกันการปั๊มช่องเก็บของ
  anti_nesting: true

# =========================================================================
# 9. ระบบจุดเกิดผู้เล่น (Spawn Allocator Settings)
# =========================================================================
# ควบคุมอัลกอริทึมการกระจายจุดเกิดผู้เล่นและทีม (Anti-Clumping Algorithm)
# =========================================================================
spawn:
  # การจัดการเมื่อจำนวนผู้เล่นหรือทีมมากกว่าจำนวนจุดเกิดที่มีอยู่ในแผนที่:
  # true  = วนจุดเกิดซ้ำแบบกระจายตัวห่างที่สุด ช่วยให้เล่นได้แม้จุดเกิดมีน้อย
  # false = ยกเลิกและแจ้งเตือนข้อผิดพลาดทันทีเพื่อป้องกันผู้เล่นเกิดจุดเดียวกัน
  allow_spawn_reuse: true

# =========================================================================
# 10. ระบบเศรษฐกิจและเกณฑ์ราคาไอเทม (Economy & Rarity Thresholds)
# =========================================================================
# กำหนดเกณฑ์ราคาสำหรับจัดเกรดความหายากอัตโนมัติ และราคาเริ่มต้นในหน้าแก้ไข
# =========================================================================
economy:
  # เกณฑ์ราคาขั้นต่ำสำหรับการจัดระดับความหายากของไอเทมโดยอัตโนมัติ
  rarity_price_thresholds:
    S: 5000.0
    A: 2500.0
    B: 1000.0
    C: 400.0
    D: 100.0

  # ราคาเริ่มต้นของแต่ละเกรดความหายาก เมื่อสร้างไอเทมใหม่ใน GUI Editor
  default_prices:
    F: 50.0
    D: 150.0
    C: 500.0
    B: 1200.0
    A: 3000.0
    S: 6000.0

# =========================================================================
# 11. หน้าต่างเมนูแก้ไขและเครื่องมือมาร์กเกอร์ (Editor & Marker Tool Visuals)
# =========================================================================
# ควบคุมการแสดงผลเอฟเฟกต์ภาพและเสียงของเครื่องมือมาร์กเกอร์และหน้าต่างแอดมิน
# =========================================================================
editor:
  # อนุภาคเอฟเฟกต์เมื่อวางบล็อกมาร์กเกอร์กล่องดรอปสำเร็จ (HAPPY_VILLAGER หรือ VILLAGER_HAPPY)
  marker_place_particle: "HAPPY_VILLAGER"

  # จำนวนเม็ดอนุภาคที่จะสปอว์นออกมา
  marker_place_particle_count: 25

  # เสียงเมื่อวางบล็อกมาร์กเกอร์ลงในโลกเทมเพลต
  marker_place_sound: "BLOCK_CHEST_LOCKED"

  # เสียงเมื่อทุบบล็อกมาร์กเกอร์เพื่อยกเลิกการลงทะเบียน
  marker_break_sound: "BLOCK_CHEST_CLOSE"

  # สีกระจกขอบหน้าต่างเมนูแก้ไข (GUI Borders) ทั้งหมด
  gui_border_material: "GRAY_STAINED_GLASS_PANE"

# =========================================================================
# 12. ระบบหน้าเว็บตั้งค่า (Web Configuration Server Settings)
# =========================================================================
# ควบคุมการทำงานของเว็บเซิร์ฟเวอร์ขนาดเล็กภายในปลั๊กอินสำหรับแก้ไขคอนฟิกผ่านเบราว์เซอร์
# เข้าใช้งานผ่าน: http://<IP เซิร์ฟเวอร์>:<port>/
# ไฟล์หน้าเว็บทั้งหมด (HTML/CSS/JS) จะถูกเก็บไว้ที่: plugins/LuminaExtractionCore/web/
# ผู้ดูแลเซิร์ฟเวอร์สามารถเข้าไปแก้ไขหรือปรับแต่ง UI ของหน้าเว็บได้อย่างอิสระตามต้องการ
# =========================================================================
web_config:
  # เปิดใช้งานระบบหน้าเว็บตั้งค่าหรือไม่ (true = เปิดรันเว็บทันทีเมื่อปลั๊กอินเริ่มทำงาน, false = ปิด)
  enabled: true

  # พอร์ตสำหรับเชื่อมต่อหน้าเว็บตั้งค่า (เช่น 8080, 8888, 3000)
  port: 8080

  # IP Address สำหรับการดักฟัง (0.0.0.0 = เปิดให้เข้าถึงได้จากภายนอก, 127.0.0.1 = เข้าถึงได้เฉพาะเครื่องโฮสต์)
  bind_address: "0.0.0.0"

  # รหัสผ่านหรือความปลอดภัย (Security Token)
  # หากระบุไว้ ผู้ใช้จะต้องใส่ Token นี้ก่อนเข้าแก้ไขคอนฟิก (เว้นว่างไว้เพื่อปิดการตรวจสอบรหัสผ่าน)
  auth_token: ""

